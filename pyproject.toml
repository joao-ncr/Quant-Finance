[project]
name = "frente-e"
version = "0.1.0"
description = "Frente E: validação estatística de regras simples na B3 (Sharpe, PSR, DSR, PBO/CSCV)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
frente-e = "frente_e.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- testes
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: integra camadas ou executa a CLI em subprocesso",
    "slow: excede alguns segundos; fora da meta de 2 min da suíte unitária",
    "reference: compara com golden files gerados por implementação independente (R)",
]

# --------------------------------------------------------------------------- qualidade
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]
# Notação matemática intencional nos textos em português (T × N, B2–B5, γ₃, ρ, σ, 1 − ρ).
allowed-confusables = ["×", "–", "−", "ρ", "γ", "σ"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1.1",
]
