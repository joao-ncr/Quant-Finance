        "sp",
        "Deriv",
        "Ryacas",
        "ggplot2",
        "gridExtra",
        "lattice",
        "stringi",
        "stringr",
        "scatterplot3d",
        "MASS"
      ],
      "Enhances": [
        "RcppEigen"
      ],
      "LinkingTo": [
        "Rcpp",
        "RcppEigen"
      ],
      "Depends": [
        "R (>= 3.5.0)"
      ],
      "NeedsCompilation": "yes",
      "Author": "Albrecht Gebhardt [aut, cre, cph], Roger Bivand [aut], David Sinclair [aut, cph] (author of the shull library)",
      "Repository": "CRAN"
